<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sổ tay tình yêu 💖</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", sans-serif;
            overflow: hidden;
        }

        /* ================= TRÁI TIM BAY ================= */

        .heart {
            position: fixed;
            top: -30px;
            color: #ff4b6e;
            font-size: 20px;

            animation: fall linear forwards;

            pointer-events: none;
            z-index: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ================= CUỐN SỔ ================= */

        .notebook {
            width: 760px;
            max-width: 90vw;

            height: 540px;
            max-height: 80vh;

            position: relative;
            perspective: 2000px;

            z-index: 2;
        }

        .book {
            width: 100%;
            height: 100%;

            position: relative;

            background: #fffaf5;

            border-radius: 8px 18px 18px 8px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.25),
                inset 8px 0 0 #f1d8d8;

            overflow: hidden;
        }

        /* ================= TRANG ================= */

        .page {
            position: absolute;
            inset: 0;

            padding:
                45px
                65px
                60px
                85px;

            background:
                repeating-linear-gradient(
                    to bottom,
                    #fffaf5 0px,
                    #fffaf5 31px,
                    #f3d8dc 32px
                );

            display: none;

            animation: pageIn 0.4s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: rotateY(-15deg);
            }

            to {
                opacity: 1;
                transform: rotateY(0);
            }
        }

        /* ================= LỀ TRANG ================= */

        .page::before {
            content: "";

            position: absolute;

            left: 55px;
            top: 0;
            bottom: 0;

            width: 2px;

            background: #f2a6b1;
        }

        /* ================= BÌA ================= */

        .cover {
            background:
                linear-gradient(
                    135deg,
                    #ff6f91,
                    #ff9a9e
                );

            color: white;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            border-radius: 8px 18px 18px 8px;
        }

        .cover.active {
            display: flex;
        }

        .cover::before {
            display: none;
        }

        .cover h1 {
            color: white;
            font-size: 50px;
            margin: 10px 0;
        }

        .cover h2 {
            color: white;
            font-size: 24px;
            margin: 10px 0 20px;
        }

        .heart-big {
            font-size: 75px;
            animation: beat 1.2s infinite;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* ================= TIÊU ĐỀ ================= */

        h1 {
            text-align: center;

            color: #ff4b6e;

            font-size: 36px;

            margin: 5px 0 8px;
        }

        h2 {
            text-align: center;

            color: #ff6f91;

            font-size: 23px;

            margin: 10px 0 25px;
        }

        .date {
            text-align: right;

            color: #aaa;

            font-size: 14px;

            margin-bottom: 10px;
        }

        /* ================= NỘI DUNG ================= */

        .content {
            width: 100%;

            min-height: 250px;

            color: #555;

            font-size: 18px;

            line-height: 1.75;

            outline: none;

            text-align: left;

            white-space: pre-wrap;

            padding: 5px;
        }

        .content:empty::before {
            content:
                "Viết điều gì đó vào đây... 💕";

            color: #bbb;

            pointer-events: none;
        }

        /* ================= GỢI Ý ================= */

        .hint {
            text-align: center;

            color: #bbb;

            font-size: 13px;

            margin-top: 5px;
        }

        .saved {
            position: absolute;

            bottom: 28px;

            left: 85px;

            color: #aaa;

            font-size: 12px;
        }

        .page-number {
            position: absolute;

            bottom: 28px;

            right: 35px;

            color: #aaa;

            font-size: 13px;
        }

        /* ================= NÚT CHUYỂN TRANG ================= */

        .controls {
            position: absolute;

            bottom: -62px;

            left: 0;
            right: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;
        }

        .nav-btn {
            border: none;

            background: #ff4b6e;

            color: white;

            width: 52px;
            height: 42px;

            border-radius: 25px;

            font-size: 22px;

            cursor: pointer;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.18);

            transition: 0.25s;
        }

        .nav-btn:hover {
            transform: scale(1.1);

            background: #ff3158;
        }

        .page-count {
            color: white;

            font-weight: bold;

            min-width: 100px;

            text-align: center;
        }

        /* ================= NÚT NHẠC ================= */

        .music-btn {
            position: fixed;

            bottom: 20px;
            right: 20px;

            background: #ff4b6e;

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 25px;

            cursor: pointer;

            font-size: 16px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.2);

            transition: 0.3s;

            z-index: 5;
        }

        .music-btn:hover {
            transform: scale(1.08);
        }

        /* ================= ĐIỆN THOẠI ================= */

        @media (max-width: 600px) {

            .notebook {
                width: 92vw;
                height: 500px;
            }

            .page {
                padding:
                    35px
                    30px
                    55px
                    50px;
            }

            .page::before {
                left: 30px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 20px;
            }

            .content {
                font-size: 16px;
                min-height: 260px;
            }

            .cover h1 {
                font-size: 36px;
            }

            .cover .heart-big {
                font-size: 60px;
            }

            .saved {
                left: 50px;
            }

            .music-btn {
                bottom: 15px;
                right: 15px;

                padding: 10px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= CUỐN SỔ ================= -->

    <div class="notebook">

        <div class="book" id="book">

            <!-- ================= BÌA ================= -->

            <div class="page cover active">

                <div class="heart-big">
                    💖
                </div>

                <h1>
                    Hành trình của hai đứa 
                </h1>

                <h2>
                    Sổ tay hằng ngày
                </h2>

                <p style="color:white;">
                    Câu chuyện 8 năm làm bạn<br>
                    Mở đầu cho hành trình yêu nhau<br>
                    và cùng nhau đi đến cuối con đường
                </p>

            </div>

            <!-- Các trang được JavaScript tự tạo -->

        </div>


        <!-- ================= NÚT LẬT TRANG ================= -->

        <div class="controls">

            <button
                class="nav-btn"
                onclick="prevPage()">

                ←

            </button>


            <div
                class="page-count"
                id="pageCount">

                Bìa

            </div>


            <button
                class="nav-btn"
                onclick="nextPage()">

                →

            </button>

        </div>

    </div>


    <!-- ================= NHẠC ================= -->

    <audio
        id="music"
        loop>

        <source
            src="https://files.catbox.moe/djiasa.mp3"
            type="audio/mp3">

    </audio>


    <button
        class="music-btn"
        onclick="toggleMusic()">

        🎵 Bật nhạc

    </button>


    <script>

        /* =====================================================
           TẠO 1000 TRANG
        ===================================================== */

        const book =
            document.getElementById("book");


        const TOTAL_PAGES = 1000;


        for (
            let i = 1;
            i <= TOTAL_PAGES;
            i++
        ) {

            const page =
                document.createElement("div");


            page.className =
                "page";


            page.innerHTML = `

                <div class="date">
                    📅 Ngày ${i}
                </div>

                <h1>
                    💖 Trang ${i}
                </h1>

                <h2>
                    Chuyện hôm nay
                </h2>

                <div
                    class="content"
                    contenteditable="true"
                    data-page="${i}">
                </div>
                
                <div class="page-number">
                    ${i} / ${TOTAL_PAGES}
                </div>

            `;


            book.appendChild(page);

        }


        /* =====================================================
           LẤY TẤT CẢ TRANG
        ===================================================== */

        const pages =
            document.querySelectorAll(".page");


        let currentPage = 0;


        /* =====================================================
           HIỂN THỊ TRANG
        ===================================================== */

        function showPage(number) {

            pages.forEach(
                page => {

                    page.classList.remove(
                        "active"
                    );

                }
            );


            pages[number].classList.add(
                "active"
            );


            const pageCount =
                document.getElementById(
                    "pageCount"
                );


            if (number === 0) {

                pageCount.innerHTML =
                    "Bìa";

            } else {

                pageCount.innerHTML =
                    number +
                    " / " +
                    TOTAL_PAGES;

            }

        }


        /* =====================================================
           TRANG TIẾP
        ===================================================== */

        function nextPage() {

            if (
                currentPage <
                pages.length - 1
            ) {

                currentPage++;

                showPage(
                    currentPage
                );

            }

        }


        /* =====================================================
           TRANG TRƯỚC
        ===================================================== */

        function prevPage() {

            if (
                currentPage > 0
            ) {

                currentPage--;

                showPage(
                    currentPage
                );

            }

        }


        /* =====================================================
           PHÍM BÀN PHÍM
        ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextPage();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    prevPage();

                }

            }
        );


        /* =====================================================
           TỰ ĐỘNG LƯU NỘI DUNG
        ===================================================== */

        const contents =
            document.querySelectorAll(
                ".content"
            );


        contents.forEach(
            content => {

                const pageNumber =
                    content.dataset.page;


                /* Lấy nội dung đã lưu */

                const saved =
                    localStorage.getItem(
                        "dangnhu-page-" +
                        pageNumber
                    );


                if (saved) {

                    content.innerHTML =
                        saved;

                }


                /* Tự động lưu khi gõ */

                content.addEventListener(
                    "input",
                    function() {

                        localStorage.setItem(

                            "dangnhu-page-" +
                            pageNumber,

                            content.innerHTML

                        );

                    }
                );

            }
        );


        /* =====================================================
           TRÁI TIM BAY
        ===================================================== */

        function createHeart() {

            const heart =
                document.createElement(
                    "div"
                );


            heart.className =
                "heart";


            heart.innerHTML =
                "❤";


            heart.style.left =
                Math.random() * 100 +
                "vw";


            heart.style.animationDuration =
                (
                    3 +
                    Math.random() * 3
                ) +
                "s";


            heart.style.fontSize =
                (
                    16 +
                    Math.random() * 20
                ) +
                "px";


            document.body.appendChild(
                heart
            );


            setTimeout(
                () => {

                    heart.remove();

                },
                6000
            );

        }


        setInterval(
            createHeart,
            300
        );


        /* =====================================================
           NHẠC
        ===================================================== */

        const music =
            document.getElementById(
                "music"
            );


        const btn =
            document.querySelector(
                ".music-btn"
            );


        let isPlaying = false;


        function toggleMusic() {

            if (!isPlaying) {

                music.play();

                btn.innerHTML =
                    "⏸ Tắt nhạc";

            }

            else {

                music.pause();

                btn.innerHTML =
                    "🎵 Bật nhạc";

            }


            isPlaying =
                !isPlaying;

        }

  apiKey: "AIzaSyA9h9kTm3dWswOAkyeczdPWzUQdNw8riSM",
  authDomain: "sotay-20e8c.firebaseapp.com",

  appId: "1:90618795716:web:2b047cce89c3e8e10e9b91",
  measurementId: "G-BCB3W7BH58"
};


    </script>

</body>
</html>
